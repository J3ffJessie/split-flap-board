[package]
name = "splitflap-desktop"
version = "0.1.0"
description = "Split-flap departure board desktop app"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "splitflap_desktop_lib"
# No "cdylib" here: this project is desktop-only (no mobile target). cdylib
# is only needed to produce a shared library for Android/iOS embedding, and
# on windows-gnu it re-exports every public symbol in the whole dependency
# graph, which blows past the PE export-ordinal limit (65535) for a
# dependency tree this size. rlib alone links into the .exe fine.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chrono-tz = "0.10"
sha2 = "0.10"
base64 = "0.22"
# windows-native is required — keyring has no default backend, and without
# it silently falls back to a non-persistent mock store (write "succeeds"
# but nothing is actually retrievable afterward).
keyring = { version = "3", features = ["windows-native"] }
rand = "0.8"
url = "2"
open = "5"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "test-util"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
